{% extends "base.html" %}{% block content %}<section class="form-wrap"><small>С РАДОСТЬЮ СНОВА ВИДЕТЬ</small><h1>Вход</h1><form method="post" class="card">{% csrf_token %}{% if form.errors %}<p class="error">Неверный логин или пароль.</p>{% endif %}<label>Логин{{ form.username }}</label><label>Пароль{{ form.password }}</label><button class="button full">Войти</button></form><p class="center muted">Нет аккаунта? <a href="{% url 'signup' %}">Регистрация</a></p></section>{% endblock %}
