{% extends "base.html" %}{% block content %}<section class="form-wrap"><small>CHESSCUP ACCOUNT</small><h1>{{ title }}</h1><p class="muted">Заполни поля, чтобы продолжить.</p><form method="post" class="card">{% csrf_token %}{% for f in form %}<label>{{ f.label }}{{ f }}{% if f.help_text %}<small>{{ f.help_text|safe }}</small>{% endif %}{% for e in f.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>{% endfor %}<button class="button full">{{ button }}</button></form><p class="center muted">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p></section>{% endblock %}
