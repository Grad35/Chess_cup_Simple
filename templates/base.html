{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ChessCup{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header><a class="brand" href="/">♞ ChessCup</a><nav><a href="/">Турниры</a>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Мои заявки</a><form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="navbutton">Выйти</button></form>{% else %}<a href="{% url 'login' %}">Войти</a><a class="nav-cta" href="{% url 'signup' %}">Регистрация</a>{% endif %}</nav></header><main class="container">{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>ChessCup · Учебный проект</footer></body></html>
